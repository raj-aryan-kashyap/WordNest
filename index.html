<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121A24">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Learn useful English words for your work and life.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WordNest">
  <title>WordNest</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Fonts: Figtree (interface), Newsreader (the word itself), Noto Sans Devanagari (Hindi) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Small notice shown when the phone goes offline -->
  <div id="net-banner" class="net-banner" role="status" hidden>You're offline. Your saved words still work.</div>

  <!-- Every screen renders into #app -->
  <main id="app" class="app" tabindex="-1"></main>

  <!-- Bottom navigation (hidden on focus screens like onboarding and revision) -->
  <nav id="tabbar" class="tabbar" aria-label="Main" hidden></nav>

  <!-- Overlays -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="sheet-root"></div>

  <noscript><p style="padding:24px;color:#E8EEF2">Please turn on JavaScript to use WordNest.</p></noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
